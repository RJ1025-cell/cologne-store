<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LuxeDecants</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://js.stripe.com/v3"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
    color: white;
    font-family: 'Poppins', Arial, Helvetica, sans-serif;
}

.navbar {
    background: linear-gradient(135deg, #000 0%, #1a0033 100%);
    color: white;
    padding: 0.5rem 0;
    border-bottom: 2px solid #d4af37;
    box-shadow: 0 8px 32px rgba(212, 175, 55, 0.1);
}

.navbar .navbar-brand {
    color: white;
    width: 171px;
    height: 172px;
    padding: 0;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 2px;
}

.btn-cart {
    background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
    color: #000;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
    transition: all 0.3s ease;
}

.btn-cart:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
}

.card {
    background: linear-gradient(135deg, #1c1c2e 0%, #2d1b4e 100%);
    border: 1px solid rgba(212, 175, 55, 0.2);
    transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
    color: white;
    border-radius: 15px;
    overflow: hidden;
    position: relative;
}

.card::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
    transition: left 0.5s;
    z-index: 10;
}

.card:hover::before {
    left: 100%;
}

.card:hover {
    transform: translateY(-12px) scale(1.02);
    box-shadow: 0 20px 50px rgba(212, 175, 55, 0.25), 0 2px 8px rgba(0, 0, 0, 0.6);
    border-color: rgba(212, 175, 55, 0.5);
}

.card img {
    height: 300px;
    object-fit: cover;
    transition: transform 0.4s ease;
}

.card:hover img {
    transform: scale(1.08);
}

.card-body {
    padding: 25px;
}

.card-title {
    font-size: 1.3em;
    font-weight: 600;
    margin-bottom: 15px;
}

.price {
    font-size: 26px;
    font-weight: 700;
    margin: 15px 0;
    background: linear-gradient(45deg, #d4af37, #ffd700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.btn-buy {
    background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
    color: #000;
    font-weight: 700;
    border: none;
    padding: 12px 30px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
}

.btn-buy::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

.btn-buy:hover::before {
    width: 300px;
    height: 300px;
}

.btn-buy:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
}

/* Full-screen cart overlay */
#cart-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(15, 15, 15, 0.98) 0%, rgba(26, 26, 46, 0.98) 100%);
    color: white;
    z-index: 9999;
    overflow-y: auto;
    padding: 50px 20px;
    backdrop-filter: blur(10px);
}

#cart-overlay h2 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 2.5em;
    background: linear-gradient(45deg, #d4af37, #ffd700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.close-btn {
    background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
    color: #000;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    position: absolute;
    top: 30px;
    right: 30px;
    transition: all 0.3s ease;
}

.close-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
}

#cart-overlay {
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

#cart-items {
    list-style: none;
    padding: 0;
    margin: 40px auto;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.cart-item {
    background: linear-gradient(135deg, #1c1c2e 0%, #2d1b4e 100%);
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(212, 175, 55, 0.1);
}

.cart-item:hover {
    border-color: rgba(212, 175, 55, 0.5);
    box-shadow: 0 12px 35px rgba(212, 175, 55, 0.2);
}

.cart-item-info {
    flex: 1;
}

.cart-item-name {
    font-size: 1.1em;
    font-weight: 600;
    margin-bottom: 8px;
    color: #d4af37;
}

.cart-item-price {
    font-size: 1.2em;
    color: #d4af37;
    font-weight: 700;
}

.cart-item-remove {
    background: none;
    border: 1px solid rgba(212, 175, 55, 0.3);
    color: #d4af37;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s ease;
    margin-left: 15px;
}

.cart-item-remove:hover {
    background: rgba(212, 175, 55, 0.2);
    border-color: rgba(212, 175, 55, 0.6);
    transform: scale(1.05);
}

.qty-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: 15px;
}

.qty-btn {
    background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
    color: #000;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
    font-size: 16px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.qty-btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

.qty-btn:hover::before {
    width: 300px;
    height: 300px;
}

.qty-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
}

.qty-display {
    min-width: 30px;
    text-align: center;
    font-weight: 600;
    color: #d4af37;
}

#cart-summary {
    max-width: 700px;
    margin: 40px auto;
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.05) 0%, rgba(212, 175, 55, 0.1) 100%);
    border: 2px solid rgba(212, 175, 55, 0.3);
    border-radius: 12px;
    padding: 30px;
    text-align: center;
}

.total-label {
    font-size: 16px;
    color: #ccc;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.total-amount {
    display: inline-block;
    font-size: 3em;
    font-weight: 700;
    background: linear-gradient(45deg, #d4af37, #ffd700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

#cart-total {
    font-size: 3em;
    font-weight: 700;
    background: linear-gradient(45deg, #d4af37, #ffd700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

#checkout-btn {
    background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
    color: #000 !important;
    padding: 14px 40px !important;
    border: none !important;
    border-radius: 8px !important;
    cursor: pointer !important;
    font-weight: 700 !important;
    font-size: 16px !important;
    text-transform: uppercase !important;
    letter-spacing: 1px !important;
    transition: all 0.3s ease !important;
    position: relative !important;
    overflow: hidden !important;
    margin-top: 20px !important;
}

#checkout-btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

#checkout-btn:hover::before {
    width: 300px;
    height: 300px;
}

#checkout-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 35px rgba(212, 175, 55, 0.4) !important;
}

.empty-cart {
    text-align: center;
    padding: 60px 20px;
    font-size: 1.5em;
    color: #aaa;
}

.empty-cart p {
    margin-bottom: 20px;
}

.empty-cart .btn-shop {
    background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
    color: #000;
    padding: 12px 30px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s ease;
}

.empty-cart .btn-shop:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
}

</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark">
<div class="container d-flex align-items-center">
    <div class="flex-grow-1 text-center">
        <img src="images/logo.png" alt="LuxeDecants Logo" class="navbar-brand">
    </div>
    <button class="btn-cart" onclick="toggleCart()">🛒 Cart (<span id="cart-count">0</span>)</button>
</div>
</nav>

<!-- Full-Screen Cart Overlay -->
<div id="cart-overlay">
    <button class="close-btn" onclick="toggleCart()">✖</button>
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <div id="cart-summary">
        <div class="total-label">Order Total (incl. $5 shipping)</div>
        <div class="total-amount">$<span id="cart-total">0.00</span></div>
        <button id="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
    </div>
</div>

<!-- Products Grid -->
<div class="container mt-5">
<div class="row g-4">

<!-- Product 1 -->
<div class="col-md-4">
<div class="card text-center p-3">
<img src="images/luxe_fantasy.png">
<div class="card-body">
<h5>Luxe Fantasy</h5>
<p class="price">$9.42</p>
<button class="btn btn-buy w-100" onclick="addToCart('Luxe Fantasy',9.42,'images/luxe_fantasy.png')">Add to Cart</button>
</div>
</div>
</div>

<!-- Product 2 -->
<div class="col-md-4">
<div class="card text-center p-3">
<img src="images/cologne2.jpg">
<div class="card-body">
<h5>Jean Paul Gaultier Le Male Le Parfum</h5>
<p class="price">$7.60</p>
<button class="btn btn-buy w-100" onclick="addToCart('Jean Paul Gaultier Le Male Le Parfum',7.60,'images/cologne2.jpg')">Add to Cart</button>
</div>
</div>
</div>

<!-- Product 3 -->
<div class="col-md-4">
<div class="card text-center p-3">
<img src="images/cologne3.jpg">
<div class="card-body">
<h5>Supremacy Collector's Edition</h5>
<p class="price">$5.17</p>
<button class="btn btn-buy w-100" onclick="addToCart('Supremacy Collector\'s Edition',5.17,'images/cologne3.jpg')">Add to Cart</button>
</div>
</div>
</div>

<!-- Product 4 -->
<div class="col-md-4">
<div class="card text-center p-3">
<img src="images/luxe_brun.png">
<div class="card-body">
<h5>Luxe Brun</h5>
<p class="price">$3.72</p>
<button class="btn btn-buy w-100" onclick="addToCart('Luxe Brun',3.72,'images/luxe_brun.png')">Add to Cart</button>
</div>
</div>
</div>

<!-- Product 5 -->
<div class="col-md-4">
<div class="card text-center p-3">
<img src="images/cologne5.jpg">
<div class="card-body">
<h5>Jean Paul Gaultier Le Beau</h5>
<p class="price">$7.78</p>
<button class="btn btn-buy w-100" onclick="addToCart('Jean Paul Gaultier Le Beau',7.78,'images/cologne5.jpg')">Add to Cart</button>
</div>
</div>
</div>

<!-- Product 6 -->
<div class="col-md-4">
<div class="card text-center p-3">
<img src="images/cologne6.jpg">
<div class="card-body">
<h5>Game Of Spades Wildcard</h5>
<p class="price">$5.83</p>
<button class="btn btn-buy w-100" onclick="addToCart('Game Of Spades Wildcard',5.83,'images/cologne6.jpg')">Add to Cart</button>
</div>
</div>
</div>

</div>
</div>

<script>
let cart = [];
try {
    const storedCart = localStorage.getItem('cart');
    if (storedCart) {
        cart = JSON.parse(storedCart);
    }
} catch (error) {
    console.error('Error loading cart from localStorage:', error);
    localStorage.removeItem('cart'); // Clear corrupted data
}
updateCart(); // Initialize cart display on page load

function addToCart(name, price, image){
    const existingItem = cart.find(item => item.name === name);
    if (existingItem) {
        existingItem.quantity += 1;
    } else {
        cart.push({name, price, image, quantity: 1});
    }
    updateCart();
}

function addItem(index) {
    cart[index].quantity += 1;
    updateCart();
}

function removeItem(index) {
    if (cart[index].quantity > 1) {
        cart[index].quantity -= 1;
    } else {
        cart.splice(index, 1);
    }
    updateCart();
}

function updateCart(){
    localStorage.setItem('cart', JSON.stringify(cart));
    const cartList = document.getElementById("cart-items");
    cartList.innerHTML = "";
    let total = 0;
    cart.forEach((item, index) => {
        const li = document.createElement("li");
        const img = document.createElement("img");
        img.src = item.image;
        img.style.width = "50px";
        img.style.height = "50px";
        img.style.objectFit = "cover";
        img.style.marginRight = "10px";
        li.appendChild(img);
        li.appendChild(document.createTextNode(`${item.name} - $${item.price.toFixed(2)} x ${item.quantity}`));
        const plusBtn = document.createElement("button");
        plusBtn.textContent = "+";
        plusBtn.onclick = () => addItem(index);
        plusBtn.style.marginLeft = "10px";
        li.appendChild(plusBtn);
        const minusBtn = document.createElement("button");
        minusBtn.textContent = "-";
        minusBtn.onclick = () => removeItem(index);
        minusBtn.style.marginLeft = "5px";
        li.appendChild(minusBtn);
        cartList.appendChild(li);
        total += item.price * item.quantity;
    });
    total += 5; // Flat rate shipping
    document.getElementById("cart-total").textContent = total.toFixed(2);
    document.getElementById("cart-count").textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
}

async function checkout() {
    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }
    try {
        const response = await fetch('/create-checkout-session', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ items: cart }),
        });
        const { url } = await response.json();
        window.location = url;
    } catch (error) {
        console.error('Error:', error);
        alert('Something went wrong. Please try again.');
    }
}

// Toggle full-screen cart overlay
function toggleCart(){
    const overlay = document.getElementById("cart-overlay");
    overlay.style.display = overlay.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
