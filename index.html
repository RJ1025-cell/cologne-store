<!DOCTYPE html>
<html lang="en">

<head>
<link rel="icon" type="image/png" href="images/logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LuxeDecants</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://js.stripe.com/v3"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

@keyframes fadeInDown {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes glow {
    0%, 100% {
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.3), 0 8px 32px rgba(212, 175, 55, 0.1);
    }
    50% {
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.5), 0 8px 32px rgba(212, 175, 55, 0.2);
    }
}

body {
    background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
    color: white;
    font-family: 'Poppins', Arial, Helvetica, sans-serif;
    animation: fadeInUp 0.8s ease;
}

.navbar {
    background: linear-gradient(135deg, #000 0%, #1a0033 100%);
    color: white;
    padding: 0.5rem 0;
    border-bottom: 2px solid #d4af37;
    box-shadow: 0 8px 32px rgba(212, 175, 55, 0.2);
    animation: fadeInDown 0.6s ease;
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.navbar .navbar-brand {
    color: white;
    width: 171px;
    height: 172px;
    padding: 0;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 2px;
    transition: transform 0.3s ease;
}

.navbar .navbar-brand:hover {
    transform: scale(1.05);
}

.btn-cart {
    background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
    color: #000;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
}

.btn-cart::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    transform: translate(-50%, -50%);
    transition: width 0.5s, height 0.5s;
}

.btn-cart:hover::before {
    width: 200px;
    height: 200px;
}

.btn-cart:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
}

.card {
    background: linear-gradient(135deg, #1c1c2e 0%, #2d1b4e 100%);
    border: 1px solid rgba(212, 175, 55, 0.3);
    transition: all 0.5s cubic-bezier(0.23, 1, 0.320, 1);
    color: white;
    border-radius: 15px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    animation: fadeInUp 0.6s ease backwards;
}

.card:nth-child(1) { animation-delay: 0.1s; }
.card:nth-child(2) { animation-delay: 0.2s; }
.card:nth-child(3) { animation-delay: 0.3s; }
.card:nth-child(4) { animation-delay: 0.1s; }
.card:nth-child(5) { animation-delay: 0.2s; }
.card:nth-child(6) { animation-delay: 0.3s; }

.card::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.25), transparent);
    transition: left 0.6s ease;
    z-index: 10;
}

.card:hover::before {
    left: 100%;
}

.card::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 30% 30%, rgba(212, 175, 55, 0.1) 0%, transparent 50%);
    pointer-events: none;
}

.card:hover {
    transform: translateY(-15px) scale(1.02);
    box-shadow: 0 25px 60px rgba(212, 175, 55, 0.3), 0 8px 32px rgba(0, 0, 0, 0.5);
    border-color: rgba(212, 175, 55, 0.6);
}

.card img {
    height: 300px;
    object-fit: cover;
    transition: transform 0.5s cubic-bezier(0.23, 1, 0.320, 1);
    filter: brightness(0.9);
}

.card:hover img {
    transform: scale(1.12);
    filter: brightness(1);
}

.card-body {
    padding: 25px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, rgba(0, 0, 0, 0.2) 100%);
}

.card-title {
    font-size: 1.3em;
    font-weight: 600;
    margin-bottom: 15px;
    letter-spacing: 0.5px;
}

.price {
    font-size: 28px;
    font-weight: 700;
    margin: 15px 0;
    background: linear-gradient(45deg, #ffd700, #ffed4e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
}

.btn-buy {
    background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
    color: #000;
    font-weight: 700;
    border: none;
    padding: 14px 35px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 2px;
    position: relative;
    overflow: hidden;
    font-size: 13px;
    box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
}

.btn-buy::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.4);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

.btn-buy:hover::before {
    width: 300px;
    height: 300px;
}

.btn-buy:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 35px rgba(212, 175, 55, 0.5);
}

/* Full-screen cart overlay */
#cart-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(15, 15, 15, 0.98) 0%, rgba(26, 26, 46, 0.98) 100%);
    color: white;
    z-index: 9999;
    overflow-y: auto;
    padding: 50px 20px;
    backdrop-filter: blur(15px);
    animation: fadeInUp 0.3s ease;
}

#cart-overlay h2 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 2.8em;
    background: linear-gradient(45deg, #ffd700, #ffed4e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
    animation: fadeInDown 0.5s ease;
}

.close-btn {
    background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
    color: #000;
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    position: absolute;
    top: 30px;
    right: 30px;
    transition: all 0.3s ease;
    box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
    font-size: 18px;
}

.close-btn:hover {
    transform: scale(1.1) rotate(90deg);
    box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5);
}

#cart-overlay {
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

#cart-items {
    list-style: none;
    padding: 0;
    margin: 40px auto;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.empty-cart {
    text-align: center;
    padding: 60px 20px;
    font-size: 1.5em;
    color: #aaa;
}

.empty-cart p {
    margin-bottom: 20px;
}

.empty-cart .btn-shop {
    background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
    color: #000;
    padding: 14px 35px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
}

.empty-cart .btn-shop:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(212, 175, 55, 0.5);
}

.cart-item {
    background: linear-gradient(135deg, #1c1c2e 0%, #2d1b4e 100%);
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(212, 175, 55, 0.1);
}

.cart-item:hover {
    border-color: rgba(212, 175, 55, 0.6);
    box-shadow: 0 12px 40px rgba(212, 175, 55, 0.2);
    transform: translateX(5px);
}

.cart-item-info {
    flex: 1;
}

.cart-item-name {
    font-size: 1.1em;
    font-weight: 600;
    margin-bottom: 8px;
    color: #ffd700 !important;
}

.cart-item-price {
    font-size: 1.2em;
    color: #d4af37;
    font-weight: 700;
}

.cart-item-remove {
    background: none;
    border: 2px solid rgba(212, 175, 55, 0.4);
    color: #d4af37;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s ease;
    margin-left: 15px;
}

.cart-item-remove:hover {
    background: rgba(212, 175, 55, 0.15);
    border-color: rgba(212, 175, 55, 0.8);
    transform: scale(1.08);
}

.qty-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: 15px;
}

.qty-btn {
    background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%) !important;
    color: #000 !important;
    border: none !important;
    padding: 8px 16px !important;
    border-radius: 8px !important;
    cursor: pointer !important;
    font-weight: 700 !important;
    font-size: 12px !important;
    transition: all 0.3s ease !important;
    position: relative !important;
    overflow: hidden !important;
    text-transform: uppercase !important;
    letter-spacing: 1px !important;
    box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25) !important;
}

.qty-btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

.qty-btn:hover::before {
    width: 200px !important;
    height: 200px !important;
}

.qty-btn:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4) !important;
}

.qty-display {
    min-width: 30px;
    text-align: center;
    font-weight: 700;
    color: #ffd700;
    font-size: 1.1em;
}

#cart-summary {
    max-width: 700px;
    margin: 40px auto;
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.08) 0%, rgba(212, 175, 55, 0.12) 100%);
    border: 2px solid rgba(212, 175, 55, 0.4);
    border-radius: 15px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 15px 50px rgba(212, 175, 55, 0.15);
    animation: fadeInUp 0.6s ease 0.3s backwards;
}

.total-label {
    font-size: 14px;
    color: #bbb;
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
}

.total-amount {
    display: block;
    font-size: 3.2em;
    font-weight: 700;
    background: linear-gradient(45deg, #ffd700, #ffed4e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 30px;
    letter-spacing: 1px;
}

#cart-total {
    font-size: inherit;
    font-weight: 700;
}

#checkout-btn {
    background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
    color: #000 !important;
    padding: 16px 50px !important;
    border: none !important;
    border-radius: 8px !important;
    cursor: pointer !important;
    font-weight: 700 !important;
    font-size: 15px !important;
    text-transform: uppercase !important;
    letter-spacing: 2px !important;
    transition: all 0.3s ease !important;
    position: relative !important;
    overflow: hidden !important;
    margin-top: 25px !important;
    box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4) !important;
}

#checkout-btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.4);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

#checkout-btn:hover::before {
    width: 300px;
    height: 300px;
}

#checkout-btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 15px 40px rgba(212, 175, 55, 0.6) !important;
}

/* Container styling */
.container {
    max-width: 1200px;
    margin: 0 auto;
}

.row {
    margin-top: 60px;
    margin-bottom: 40px;
}

::selection {
    background: rgba(212, 175, 55, 0.3);
    color: #ffd700;
}

</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark">
<div class="container d-flex align-items-center">
    <div class="flex-grow-1 text-center">
        <img src="images/logo.png" alt="LuxeDecants Logo" class="navbar-brand">
    </div>
    <button class="btn-cart" onclick="toggleCart()">🛒 (<span id="cart-count">0</span>)</button>
</div>
</nav>

<!-- Full-Screen Cart Overlay -->
<div id="cart-overlay">
    <button class="close-btn" onclick="toggleCart()">✖</button>
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <div id="cart-summary">
        <div class="total-label">Order Total (incl. $5 shipping)</div>
        <div class="total-amount">$<span id="cart-total">0.00</span></div>
        <button id="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
    </div>
</div>

<!-- Products Grid -->
<div class="container mt-5">
<div class="row g-4">

<!-- Product 1 -->
<div class="col-lg-4 col-md-6">
<div class="card text-center p-3">
<img src="images/luxe_fantasy.png">
<div class="card-body">
<h5>Luxe Fantasy</h5>
<p class="price">$9.42</p>
<button class="btn btn-buy w-100" onclick="addToCart('Luxe Fantasy',9.42,'images/luxe_fantasy.png')">Add to Cart</button>
</div>
</div>
</div>

<!-- Product 2 -->
<div class="col-lg-4 col-md-6">
<div class="card text-center p-3">
<img src="images/Luxe_Le_Male_Le_Parfum.png">
<div class="card-body">
<h5>Jean Paul Gaultier Le Male Le Parfum</h5>
<p class="price">$7.60</p>
<button class="btn btn-buy w-100" onclick="addToCart('Jean Paul Gaultier Le Male Le Parfum',7.60,'images/Luxe_Le_Male_Le_Parfum.png')">Add to Cart</button>
</div>
</div>
</div>

<!-- Product 3 -->
<div class="col-lg-4 col-md-6">
<div class="card text-center p-3">
<img src="images/Luxe_Collectors_Edition.png">
<div class="card-body">
<h5>Supremacy Collector's Edition</h5>
<p class="price">$5.17</p>
<button class="btn btn-buy w-100" onclick="addToCart('Supremacy Collector\'s Edition',5.17,'images/Luxe_Collectors_Edition.png')">Add to Cart</button>
</div>
</div>
</div>



<!-- Product 4 -->
<div class="col-lg-4 col-md-6">
<div class="card text-center p-3">
<img src="images/luxe_brun.png">
<div class="card-body">
<h5>Luxe Brun</h5>
<p class="price">$3.72</p>
<button class="btn btn-buy w-100" onclick="addToCart('Luxe Brun',3.72,'images/luxe_brun.png')">Add to Cart</button>
</div>
</div>
</div>

<!-- Product 5 -->
<div class="col-lg-4 col-md-6">
<div class="card text-center p-3">
<img src="images/Luxe_Le_Beau_Le_Parfum.png">
<div class="card-body">
<h5>Jean Paul Gaultier Le Beau</h5>
<p class="price">$7.78</p>
<button class="btn btn-buy w-100" onclick="addToCart('Jean Paul Gaultier Le Beau',7.78,'images/Luxe_Le_Beau_Le_Parfum.png')">Add to Cart</button>
</div>
</div>
</div>

<!-- Product 6 -->
<div class="col-lg-4 col-md-6">
<div class="card text-center p-3">
<img src="images/Luxe_Wildcard.png">
<div class="card-body">
<h5>Game Of Spades Wildcard</h5>
<p class="price">$5.83</p>
<button class="btn btn-buy w-100" onclick="addToCart('Game Of Spades Wildcard',5.83,'images/Luxe_Wildcard.png')">Add to Cart</button>
</div>
</div>
</div>
</div>

<script>
let cart = [];
try {
    const storedCart = localStorage.getItem('cart');
    if (storedCart) {
        cart = JSON.parse(storedCart);
    }
} catch (error) {
    console.error('Error loading cart from localStorage:', error);
    localStorage.removeItem('cart'); // Clear corrupted data
}
updateCart(); // Initialize cart display on page load

function addToCart(name, price, image){
    const existingItem = cart.find(item => item.name === name);
    if (existingItem) {
        existingItem.quantity += 1;
    } else {
        cart.push({name, price, image, quantity: 1});
    }
    updateCart();
}

function addItem(index) {
    cart[index].quantity += 1;
    updateCart();
}

function removeItem(index) {
    if (cart[index].quantity > 1) {
        cart[index].quantity -= 1;
    } else {
        cart.splice(index, 1);
    }
    updateCart();
}

function updateCart(){
    localStorage.setItem('cart', JSON.stringify(cart));
    const cartList = document.getElementById("cart-items");
    const totalLabel = document.querySelector(".total-label");
    cartList.innerHTML = "";
    let total = 0;
    
    if (cart.length === 0) {
        cartList.innerHTML = '<div class="empty-cart"><p>Your cart is empty</p><button class="btn-shop" onclick="toggleCart()">Continue Shopping</button></div>';
        document.getElementById("cart-total").textContent = '0.00';
        document.getElementById("cart-count").textContent = '0';
        totalLabel.textContent = 'Order Total';
        return;
    }
    
    totalLabel.textContent = 'Order Total (incl. $5 shipping)';
    cart.forEach((item, index) => {
        const li = document.createElement("li");
        const img = document.createElement("img");
        img.src = item.image;
        img.style.width = "50px";
        img.style.height = "50px";
        img.style.objectFit = "cover";
        img.style.marginRight = "10px";
        li.appendChild(img);
        li.appendChild(document.createTextNode(`${item.name} - $${item.price.toFixed(2)} x ${item.quantity}`));
        const plusBtn = document.createElement("button");
        plusBtn.textContent = "+";
        plusBtn.onclick = () => addItem(index);
        plusBtn.style.marginLeft = "10px";
        plusBtn.style.background = "linear-gradient(135deg, #d4af37 0%, #ffd700 100%)";
        plusBtn.style.color = "#000";
        plusBtn.style.padding = "8px 16px";
        plusBtn.style.border = "none";
        plusBtn.style.borderRadius = "8px";
        plusBtn.style.cursor = "pointer";
        plusBtn.style.fontWeight = "700";
        plusBtn.style.fontSize = "12px";
        plusBtn.style.textTransform = "uppercase";
        plusBtn.style.letterSpacing = "1px";
        plusBtn.style.transition = "all 0.3s ease";
        li.appendChild(plusBtn);
        const minusBtn = document.createElement("button");
        minusBtn.textContent = "-";
        minusBtn.onclick = () => removeItem(index);
        minusBtn.style.marginLeft = "5px";
        minusBtn.style.background = "linear-gradient(135deg, #d4af37 0%, #ffd700 100%)";
        minusBtn.style.color = "#000";
        minusBtn.style.padding = "8px 16px";
        minusBtn.style.border = "none";
        minusBtn.style.borderRadius = "8px";
        minusBtn.style.cursor = "pointer";
        minusBtn.style.fontWeight = "700";
        minusBtn.style.fontSize = "12px";
        minusBtn.style.textTransform = "uppercase";
        minusBtn.style.letterSpacing = "1px";
        minusBtn.style.transition = "all 0.3s ease";
        li.appendChild(minusBtn);
        cartList.appendChild(li);
        total += item.price * item.quantity;
    });
    total += 5; // Flat rate shipping
    document.getElementById("cart-total").textContent = total.toFixed(2);
    document.getElementById("cart-count").textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
}

async function checkout() {
    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }
    try {
        const response = await fetch('/create-checkout-session', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ items: cart }),
        });
        const { url } = await response.json();
        window.location = url;
    } catch (error) {
        console.error('Error:', error);
        alert('Something went wrong. Please try again.');
    }
}

// Toggle full-screen cart overlay
function toggleCart(){
    const overlay = document.getElementById("cart-overlay");
    overlay.style.display = overlay.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
