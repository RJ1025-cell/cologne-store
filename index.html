<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LuxeDecants</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://js.stripe.com/v3/"></script>

<style>
body {
    background: #111;
    color: white;
    margin: 0;
    font-family: Arial, sans-serif;
}

.navbar {
    background: black;
    color: white;
    padding: 0.25rem 0;
}

.navbar .navbar-brand {
    color: white;
    width: 171px;
    height: 172px;
    padding: 0;
}

.btn-cart {
    background: none;
    border: none;
    color: white;
    font-size: 1.2rem;
    cursor: pointer;
}

.card {
    background: #1c1c1c;
    border: none;
    transition: 0.3s;
    color: white;
}

.card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
}

.card img {
    height: 300px;
    object-fit: cover;
}

.price {
    font-size: 20px;
    font-weight: bold;
    color: white;
}

.btn-buy {
    background: white;
    color: black;
    font-weight: bold;
}

.btn-buy:hover {
    background: #ddd;
    color: black;
}

/* Full-screen cart overlay */
#cart-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(20, 20, 20, 0.95);
    color: white;
    z-index: 9999;
    overflow-y: auto;
    padding: 50px 20px;
}

#cart-overlay h2 {
    text-align: center;
    margin-bottom: 30px;
}

#cart-overlay ul {
    list-style: none;
    padding: 0;
    margin-bottom: 20px;
}

#cart-overlay li {
    padding: 10px 0;
    border-bottom: 1px solid #333;
    font-size: 18px;
}

#cart-overlay p.total {
    text-align: right;
    font-size: 20px;
    font-weight: bold;
}

#cart-overlay .close-btn {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 28px;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
}

</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark">
<div class="container d-flex align-items-center">
    <div class="flex-grow-1 text-center">
        <img src="images/logo.png" alt="LuxeDecants Logo" class="navbar-brand">
    </div>
    <button class="btn-cart" onclick="toggleCart()">🛒 Cart (<span id="cart-count">0</span>)</button>
</div>
</nav>

<!-- Full-Screen Cart Overlay -->
<div id="cart-overlay">
    <button class="close-btn" onclick="toggleCart()">✖</button>
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <p class="total">Total (incl. $5 shipping): $<span id="cart-total">0</span></p>
    <button id="checkout-btn" onclick="checkout()" style="background: white; color: black; padding: 10px 20px; border: none; cursor: pointer;">Checkout</button>
</div>

<!-- Products Grid -->
<div class="container mt-5">
<div class="row g-4">

<!-- Product 1 -->
<div class="col-md-4">
<div class="card text-center p-3">
<img src="images/luxe_fantasy.png">
<div class="card-body">
<h5>Luxe Fantasy</h5>
<p class="price">$9.42</p>
<button class="btn btn-buy w-100" onclick="addToCart('Luxe Fantasy',9.42,'images/luxe_fantasy.png')">Add to Cart</button>
</div>
</div>
</div>

<!-- Product 2 -->
<div class="col-md-4">
<div class="card text-center p-3">
<img src="images/cologne2.jpg">
<div class="card-body">
<h5>Jean Paul Gaultier Le Male Le Parfum</h5>
<p class="price">$7.60</p>
<button class="btn btn-buy w-100" onclick="addToCart('Jean Paul Gaultier Le Male Le Parfum',7.60,'images/cologne2.jpg')">Add to Cart</button>
</div>
</div>
</div>

<!-- Product 3 -->
<div class="col-md-4">
<div class="card text-center p-3">
<img src="images/cologne3.jpg">
<div class="card-body">
<h5>Supremacy Collector's Edition</h5>
<p class="price">$5.17</p>
<button class="btn btn-buy w-100" onclick="addToCart('Supremacy Collector\'s Edition',5.17,'images/cologne3.jpg')">Add to Cart</button>
</div>
</div>
</div>

<!-- Product 4 -->
<div class="col-md-4">
<div class="card text-center p-3">
<img src="images/luxe_brun.png">
<div class="card-body">
<h5>Luxe Brun</h5>
<p class="price">$3.72</p>
<button class="btn btn-buy w-100" onclick="addToCart('Luxe Brun',3.72,'images/luxe_brun.png')">Add to Cart</button>
</div>
</div>
</div>

<!-- Product 5 -->
<div class="col-md-4">
<div class="card text-center p-3">
<img src="images/cologne5.jpg">
<div class="card-body">
<h5>Jean Paul Gaultier Le Beau</h5>
<p class="price">$7.78</p>
<button class="btn btn-buy w-100" onclick="addToCart('Jean Paul Gaultier Le Beau',7.78,'images/cologne5.jpg')">Add to Cart</button>
</div>
</div>
</div>

<!-- Product 6 -->
<div class="col-md-4">
<div class="card text-center p-3">
<img src="images/cologne6.jpg">
<div class="card-body">
<h5>Game Of Spades Wildcard</h5>
<p class="price">$5.83</p>
<button class="btn btn-buy w-100" onclick="addToCart('Game Of Spades Wildcard',5.83,'images/cologne6.jpg')">Add to Cart</button>
</div>
</div>
</div>

</div>
</div>

<script>
let cart = [];
try {
    const storedCart = localStorage.getItem('cart');
    if (storedCart) {
        cart = JSON.parse(storedCart);
    }
} catch (error) {
    console.error('Error loading cart from localStorage:', error);
    localStorage.removeItem('cart'); // Clear corrupted data
}
updateCart(); // Initialize cart display on page load

function addToCart(name, price, image){
    const existingItem = cart.find(item => item.name === name);
    if (existingItem) {
        existingItem.quantity += 1;
    } else {
        cart.push({name, price, image, quantity: 1});
    }
    updateCart();
}

function addItem(index) {
    cart[index].quantity += 1;
    updateCart();
}

function removeItem(index) {
    if (cart[index].quantity > 1) {
        cart[index].quantity -= 1;
    } else {
        cart.splice(index, 1);
    }
    updateCart();
}

function updateCart(){
    localStorage.setItem('cart', JSON.stringify(cart));
    const cartList = document.getElementById("cart-items");
    cartList.innerHTML = "";
    let total = 0;
    cart.forEach((item, index) => {
        const li = document.createElement("li");
        const img = document.createElement("img");
        img.src = item.image;
        img.style.width = "50px";
        img.style.height = "50px";
        img.style.objectFit = "cover";
        img.style.marginRight = "10px";
        li.appendChild(img);
        li.appendChild(document.createTextNode(`${item.name} - $${item.price.toFixed(2)} x ${item.quantity}`));
        const plusBtn = document.createElement("button");
        plusBtn.textContent = "+";
        plusBtn.onclick = () => addItem(index);
        plusBtn.style.marginLeft = "10px";
        li.appendChild(plusBtn);
        const minusBtn = document.createElement("button");
        minusBtn.textContent = "-";
        minusBtn.onclick = () => removeItem(index);
        minusBtn.style.marginLeft = "5px";
        li.appendChild(minusBtn);
        cartList.appendChild(li);
        total += item.price * item.quantity;
    });
    total += 5; // Flat rate shipping
    document.getElementById("cart-total").textContent = total.toFixed(2);
    document.getElementById("cart-count").textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
}

async function checkout() {
    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }
    try {
        const response = await fetch('/create-checkout-session', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ items: cart }),
        });
        const { url } = await response.json();
        window.location = url;
    } catch (error) {
        console.error('Error:', error);
        alert('Something went wrong. Please try again.');
    }
}

// Toggle full-screen cart overlay
function toggleCart(){
    const overlay = document.getElementById("cart-overlay");
    overlay.style.display = overlay.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
